<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>马赛克序列</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffffff; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  /* 配文：垂直锚定在"视口中心 + 半个马赛克高 + 间距"，
     马赛克本身也是视口居中，所以永远正好落在图片下方，不依赖 JS 布局时序。
     版式：左栏标题（大号加粗，固定两行，右对齐贴竖线）| 竖线 | 右栏正文（两行） */
  :root {
    --capTitleSz: 31px; --capBodySz: 18px;
    --capTitleW: 150px; --capBodyW: 640px;
    --capColGap: 26px; --capBlock: 96px;   /* 配文块高度 + 底部最小留白 */
  }
  @media (max-height: 820px) {
    :root {
      --capTitleSz: 24px; --capBodySz: 15px;
      --capTitleW: 122px; --capBodyW: 520px;
      --capColGap: 20px; --capBlock: 76px;
    }
  }
  #cap {
    position: fixed; left: 0; right: 0;
    top: min(calc(50% + 310.0px), calc(100vh - var(--capBlock)));
    text-align: center; opacity: 0;
    pointer-events: none; user-select: none;
    will-change: opacity, transform;
  }
  #capRow {
    display: inline-flex; align-items: center;
    gap: var(--capColGap); text-align: left;
  }
  .tx {
    font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  }
  /* 标题：字号大、加粗，在栏宽内断成两行 */
  #capTitle {
    flex: 0 0 auto; width: var(--capTitleW); text-align: left;
    font-size: var(--capTitleSz); font-weight: 700; line-height: 1.28;
    letter-spacing: 0.04em;
    white-space: pre-line;   /* 文案里写的 
 生效，强制断成两行 */
    color: #17130f;
  }
  /* 竖线：与最高的那一栏等高，两端各留一点余量 */
  #capBar {
    flex: 0 0 auto; width: 1px; align-self: stretch;
    margin: 7px 0;
    background: #bfb3a0;
  }
  /* 正文：比标题小一号、常规字重，一栏两行 */
  #capBody {
    flex: 0 0 auto; width: var(--capBodyW);
    font-size: var(--capBodySz); font-weight: 400; line-height: 1.9;
    letter-spacing: 0.04em;
    white-space: pre-line;
    color: #3b352d;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="cap">
  <div id="capRow">
    <div id="capTitle" class="tx"></div>
    <div id="capBar"></div>
    <div id="capBody" class="tx"></div>
  </div>
</div>

const COLS = 84, ROWS = 56;
const CELL = 10, GAP = 0.0, RADIUS = 0.0;
const N = COLS * ROWS;

/* 马赛克整体尺寸：固定常量，与窗口无关 */
const MW = COLS * CELL, MH = ROWS * CELL;
const CX0 = MW / 2, CY0 = MH / 2;
const MAXR = Math.sqrt(CX0 * CX0 + CY0 * CY0);

/* —— 动画节奏 —— */
const MORPH_MS = 1900;      // 单块一次「飞出 → 归位」的时长
const DELAY_MAX = 1700;     // 起飞延迟上限：打散像一道波扫过整幅
const ENTER_MS = 1500;      // 首帧聚拢时长
const ENTER_DELAY = 640;
const ENTER_FAR = 3.2;      // 入场时散开幅度（单位：块边长）
const SHRINK = 0.15;        // 散到最开时碎片自身缩小比例（透明度不变）
const SPIN = 0.34;         // 自转基准峰值（rad）：与飞出距离相乘后，最远的块约 46°
const SPIN_LEAD = 0.86;    // 自转包络的相位提前量：先转起来，再把块甩远
const TAU = 6.283185307179586;
const SPIN_FULL = false;   // true = 整圈自转（碎片在空中翻一整圈）

/* 整圈模式：把每块的基准自转换算成整数圈，并夹在 ±2 圈内。
   用整数是为了落位那一刻严格等于 2π 的整数倍，视觉上与原位完全一致，不会"回弹"。 */
function spinTurns(i) {
  let n = Math.round(TSPIN[i] / SPIN);
  if (n > 2) n = 2; else if (n < -2) n = -2;
  return n;
}
const SWAP_P = 0.50;        // 行程中段换图：那一刻散得最开、块最小，看不出切换

/* —— 播放时序 —— */

/* 固定种子伪随机：同一份 HTML 每次打开完全一致，便于反复演示 */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* 低频斑块噪声：决定"哪一片飞得远、哪一片几乎不动"，
   这是碎裂感的关键——没有它整幅会均匀散成噪点 */
function patchNoise(x, y, s) {
  return 0.5
    + 0.26 * Math.sin(11.3 * x + 8.7 * y + s)
    + 0.13 * Math.sin(17.7 * x - 15.3 * y + 2.0 * s)
    + 0.07 * Math.sin(27.1 * x + 21.3 * y - s);
}

  /* 1 -> 2  向外膨胀：整幅放大一下再收回 */
  { aMode: "r", k: 0.26, fx: 0.50, fy: 0.50, wr: 1.00, wt: 0.00, dx: 0, dy: 0,
    band: 0.00, bx: 0, by: 0, ph: 0.0, curl: 0.35, mirror: false },
  /* 2 -> 3  向心收缩：整幅先被吸紧，再弹回 */
  { aMode: "r", k: -0.22, fx: 0.50, fy: 0.50, wr: 1.00, wt: 0.10, dx: 0, dy: 0,
    band: 0.15, bx: 5.0, by: 4.0, ph: 1.1, curl: 0.30, mirror: false },
  /* 3 -> 4  横向推走：被一阵风整幅推走再回来，带竖向波纹 */
  { aMode: "const", k: 58.0, fx: -0.30, fy: 0.50, wr: 1.00, wt: 0.00, dx: 0, dy: 0,
    band: 0.55, bx: 1.6, by: 9.5, ph: 0.5, curl: 0.22, mirror: false },
  /* 4 -> 5  左右分裂：从中间裂成两半各往外推 */
  { aMode: "split", k: 0.30, fx: 0.50, fy: 0.50, wr: 1.00, wt: 0.00, dx: 0, dy: 0,
    band: 0.30, bx: 2.0, by: 4.0, ph: 1.9, curl: 0.55, mirror: true },
  /* 5 -> 1  斜向剪切：上半往一边、下半往另一边错开 */
  { aMode: "shear", k: 0.55, sx: 1.00, sy: -0.80, fx: 0.50, fy: 0.50,
    wr: 0.40, wt: 0.00, dx: 0.90, dy: 0.40, band: 0.45, bx: 6.0, by: -5.0, ph: 2.7,
    curl: 0.40, mirror: false }
];

(function buildCenters() {
  for (let r = 0, i = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++, i++) {
      BX0[i] = c * CELL + CELL / 2;
      BY0[i] = r * CELL + CELL / 2;
    }
  }
})();

/* —— 为一次切换装配方向场 —— */
let MORPH_END = 0;          // 本次切换的全局结束时刻（最后一颗散点归位之后）
function setupScatter(k) {
  const m = MOTIFS[k % MOTIFS.length];
  const rnd = mulberry32(7700 + k * 977);
  let maxD = 0;
  for (let r = 0, i = 0; r < ROWS; r++) {
    const ny = (r + 0.5) / ROWS;
    for (let c = 0; c < COLS; c++, i++) {
      const nx = (c + 0.5) / COLS;

      /* 焦点向量（左/右分团时按半幅镜像） */
      const fx = m.mirror ? (nx < 0.5 ? m.fx : 1 - m.fx) : m.fx;
      const vx = (nx - fx) * MW, vy = (ny - m.fy) * MH;
      const rr = Math.sqrt(vx * vx + vy * vy) + 1e-6;
      const ux = vx / rr, uy = vy / rr;

      /* 宏观方向 = 径向 + 切向 + 平移，再归一化 */
      let dxv = m.wr * ux - m.wt * uy + m.dx;
      let dyv = m.wr * uy + m.wt * ux + m.dy;
      const dl = Math.sqrt(dxv * dxv + dyv * dyv) || 1;

      /* 逐块角度抖动：只给一点颗粒感，宏观动势由配方决定 */
      TANG[i] = Math.atan2(dyv / dl, dxv / dl) + (rnd() * 2 - 1) * JIT;

      /* 散开距离：先按配方给"整幅怎么动"，再用斑块/带状/抖动打碎成散点 */
      let a;
      if (m.aMode === "r") a = m.k * rr;
      else if (m.aMode === "const") a = m.k;
      else if (m.aMode === "split") a = Math.abs(nx - 0.5) * MW * m.k;
      else a = ((nx - 0.5) * m.sx + (ny - 0.5) * m.sy) * MW * m.k * 0.5;

      a *= 0.62 + 0.55 * patchNoise(nx, ny, k * 1.7);
      if (m.band) a *= 1 - m.band * (0.5 + 0.5 * Math.sin(m.bx * nx + m.by * ny + m.ph));
      a *= 0.80 + 0.40 * rnd();
      TAMP[i] = a;

      TCURL[i] = (rnd() * 2 - 1) * m.curl;
      /* 自转分两层：涡流型动势让整幅朝同一方向拧（宏观），
         再叠一层逐块随机翻滚（颗粒感），峰值约 0.6rad */
      const spinDir = m.wt ? (m.wt > 0 ? 1 : -1) : 0;
      TSPIN[i] = SPIN * (0.58 * spinDir + (rnd() * 2 - 1) * 0.85) * (0.70 + 0.60 * rnd());

      /* 起飞延迟：一道斜向波扫过（先散的地方先飞），加一点颗粒感的抖动 */
      const wv = 0.5 + 0.5 * Math.sin(2.1 * nx + 1.55 * ny + k * 1.9);
      const rn = Math.min(1, rr / MAXR);
      TDLY[i] = DELAY_MAX * (0.05 + 0.45 * rn + 0.50 * wv) * (0.92 + 0.16 * rnd());
      if (TDLY[i] > maxD) maxD = TDLY[i];
    }
  }
  /* 自转与飞出距离挂钩：飞得越远翻得越狠，几乎不动的块保持端正。
     于是中段呈现"核心还端正、边缘已经翻滚"，比全体一起转更耐看。 */
  let meanA = 0;
  for (let i = 0; i < N; i++) meanA += Math.abs(TAMP[i]);
  meanA = meanA / N || 1;
  for (let i = 0; i < N; i++) {
    const q = Math.min(1.9, Math.abs(TAMP[i]) / meanA);
    TSPIN[i] *= Math.min(1.65, 0.45 + 0.85 * q);
  }

  MORPH_END = maxD + MORPH_MS + 30;
}

/* —— 首帧：从散点云里聚拢成图 —— */
let ENTER_END = 0;
function setupEnter() {
  const rnd = mulberry32(424242);
  let maxD = 0;
  for (let r = 0, i = 0; r < ROWS; r++) {
    const ny = (r + 0.5) / ROWS;
    for (let c = 0; c < COLS; c++, i++) {
      const nx = (c + 0.5) / COLS;
      const vx = (nx - 0.5) * MW, vy = (ny - 0.5) * MH;
      const rr = Math.sqrt(vx * vx + vy * vy) + 1e-6;
      EAANG[i] = Math.atan2(vy, vx) + 0.85 + (rnd() * 2 - 1) * 0.55;
      EAAMP[i] = CELL * ENTER_FAR * (0.5 + 0.8 * patchNoise(nx, ny, 3.3))
        * (0.55 + 0.95 * Math.min(1, rr / MAXR));
      EADLY[i] = ENTER_DELAY * (0.35 + 0.65 * Math.min(1, rr / MAXR)) * (0.85 + 0.3 * rnd());
      /* 入场：整片碎片大体同向转着聚拢，像旋涡收拢 */
      EASPIN[i] = SPIN * (0.75 + (rnd() * 2 - 1) * 0.85);
      if (EADLY[i] > maxD) maxD = EADLY[i];
    }
  }
  ENTER_END = maxD + ENTER_MS + 30;
}

function layout() {
  vw = window.innerWidth; vh = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  canvas.width = Math.round(vw * dpr);
  canvas.height = Math.round(vh * dpr);
  ox = Math.round((vw - MW) / 2);
  oy = Math.round((vh - MH) / 2);
}

function smooth(p) { return p <= 0 ? 0 : p >= 1 ? 1 : p * p * (3 - 2 * p); }

function easeOutCubic(p) { return 1 - Math.pow(1 - p, 3); }

/* 一颗碎片：把原图里本块那一小片，画到 (cx,cy) 为中心的方形区域上。
   sp != 0 时带自转——直接用 setTransform 写矩阵，比 save/restore 便宜；
   sp == 0（静止帧）走无变换的快路径，保持原图 1:1 的锐利。 */
function drawBlock(img, i, cx, cy, h, sp) {
  if (cx + h < 0 || cx - h > vw || cy + h < 0 || cy - h > vh) return;
  const c = i % COLS;
  const r = (i - c) / COLS;
  const s = 2 * h;
  const sx = c * CELL + SX0, sy = r * CELL + SX0;
  if (sp) {
    const cs = Math.cos(sp) * dpr, sn = Math.sin(sp) * dpr;
    ctx.setTransform(cs, sn, -sn, cs, cx * dpr, cy * dpr);
    ctx.drawImage(img, sx, sy, SW, SW, -h, -h, s, s);
  } else {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.drawImage(img, sx, sy, SW, SW, cx - h, cy - h, s, s);
  }
}

function clear() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, vw, vh);
}

/* —— 打散 / 拼合 —— */
function drawMorph(el) {
  clear();
  const imA = imgs[fromIdx], imB = imgs[toIdx];

  for (let i = 0; i < N; i++) {
    const p = (el - TDLY[i]) / MORPH_MS;
    /* 换图时机：行程中段。此前飞出去的是旧图，此后收回来的是新图 */
    const img = p >= SWAP_P ? imB : imA;

    let x = BX0[i] + ox, y = BY0[i] + oy;
    let h = HALF, sp = 0;
    if (p > 0 && p < 1) {
      const env = Math.sin(Math.PI * p);            // 0 -> 1 -> 0
      const ang = TANG[i] + TCURL[i] * (2 * p - 1); // 去程/回程方向错开 -> 叶形轨迹
      const d = TAMP[i] * env;
      x += Math.cos(ang) * d;
      y += Math.sin(ang) * d;
      h = HALF * (1 - SHRINK * env);
      sp = SPIN_FULL
        ? TAU * spinTurns(i) * smooth(p)      // 整圈：落位时严格 2π 整数倍 ≡ 0°
        : TSPIN[i] * Math.sin(Math.PI * Math.pow(p, SPIN_LEAD));  // 摆动：略早于位移达峰
    }
    drawBlock(img, i, x, y, h, sp);
  }
}

/* —— 首帧聚拢 —— */
function drawEnter(el) {
  clear();
  const img = imgs[cur];
  for (let i = 0; i < N; i++) {
    let p = (el - EADLY[i]) / ENTER_MS;
    if (p >= 1) {
      drawBlock(img, i, BX0[i] + ox, BY0[i] + oy, HALF);
      continue;
    }
    if (p < 0) p = 0;
    const k = 1 - easeOutCubic(p);                  // 1 -> 0
    const d = EAAMP[i] * k;
    drawBlock(img, i,
      BX0[i] + ox + Math.cos(EAANG[i]) * d,
      BY0[i] + oy + Math.sin(EAANG[i]) * d,
      HALF * (1 - 0.55 * k), EASPIN[i] * k
    );
  }
}

function drawIdle() {
  clear();
  const img = imgs[cur];
  for (let i = 0; i < N; i++) drawBlock(img, i, BX0[i] + ox, BY0[i] + oy, HALF);
}

/* —— 写入配文：标题结尾的全角括号自动降档成副题 —— */
function setCap(t, b) {
  const key = t + "\n" + b;   // Python 模板里要写成 \n，否则会被转义成真换行
  if (key === capShown) return;
  capShown = key;

  capRowEl.style.display = (t || b) ? "" : "none";
  capBarEl.style.display = (t && b) ? "" : "none";   // 只有一侧有字时不画分隔线
  capTitleEl.textContent = t;
  capTitleEl.style.display = t ? "" : "none";
  capBodyEl.style.display = b ? "" : "none";
  capBodyEl.textContent = b;
}

/* —— 进入静置阶段：决定这张图停多久、配文什么时候进出 —— */
function enterHold(start, idx, isFirst) {
  cur = idx;
  mode = "hold";
  stageT0 = start;
  holdEnd = start + (idx === 0 ? HOLD_FIRST : HOLD_NEXT);
  stageDur = holdEnd - start;
  needDraw = true;

  const c = CAPS[idx];
  capCap = (c && (c[0] || c[1])) ? c : null;
  if (capCap) {
    setCap(capCap[0] || "", capCap[1] || "");
    /* 第一张：从"开始播放"算 3 秒；其余：动画一结束就淡入 */
    capInAt = isFirst ? Math.max(start, CAP_FIRST_AT) : start;
    /* 淡出必须在下一段打散动画开始前完成，留 CAP_GAP 余量 */
    capOutAt = holdEnd - CAP_OUT - CAP_GAP;
    if (capInAt > capOutAt - CAP_IN) capInAt = Math.max(start, capOutAt - CAP_IN);
  }
}

/* —— 配文：透明度完全由时间推算，不做状态记忆，跳帧也不会漂 —— */
function updateCaption(now) {
  let o = 0, dy = 10;
  if (mode === "hold" && capCap) {
    const a = smooth((now - capInAt) / CAP_IN);
    const b = smooth((now - capOutAt) / CAP_OUT);
    o = a * (1 - b);
    dy = (1 - a) * 10;
  }
  o = Math.round(o * 1000) / 1000;
  dy = Math.round(dy * 10) / 10;
  if (o !== capO) { capEl.style.opacity = o; capO = o; }
  if (dy !== capY) { capEl.style.transform = "translateY(" + dy + "px)"; capY = dy; }
}

/* —— 主循环：阶段推进按计划时刻对齐，长时间循环不会累积漂移 —— */
function frame(now) {
  while (now >= stageT0 + stageDur) {
    const next = stageT0 + stageDur;
    if (mode === "enter") {
      enterHold(next, 0, opening);
      opening = false;
    } else if (mode === "morph") {
      cur = toIdx;
      enterHold(next, cur, false);
    } else {                                  // 静置结束 -> 开始下一次打散
      fromIdx = cur;
      toIdx = (cur + 1) % NIMG;
      setupScatter(fromIdx);                  // 每跳换一套宏观动势
      mode = "morph";
      stageT0 = next;
      stageDur = MORPH_END;
      capCap = null;                          // 动画期间文字一定不可见
      needDraw = true;
    }
  }

  if (mode === "enter") drawEnter(now - stageT0);
  else if (mode === "morph") drawMorph(now - stageT0);
  else if (needDraw) { drawIdle(); needDraw = false; }

  updateCaption(now);
  requestAnimationFrame(frame);
}

let rsT = 0;
window.addEventListener("resize", function () {
  clearTimeout(rsT);
  rsT = setTimeout(function () {
    layout();
    if (mode === "hold") { drawIdle(); needDraw = false; }
  }, 120);
});

/* 图像是内联 data URI，但仍要等浏览器解码完，否则头几帧是空的 */
function start() {
  if (imgReady) return;
  imgReady = true;
  layout();
  setupEnter();
  cur = 0; fromIdx = 0; toIdx = 0;
  mode = "enter";
  stageT0 = performance.now();
  stageDur = ENTER_END;
  requestAnimationFrame(frame);
}

layout();                      // 先把画布尺寸定好，解码期间也只是一片干净的白底
(function loadAll() {
  let done = 0;
  IMGS_SRC.forEach(function (src, i) {
    const im = new Image();
    im.onload = im.onerror = function () {
      imgs[i] = im;
      if (++done === NIMG) start();
    };
    im.src = src;
  });
})();
</script>
